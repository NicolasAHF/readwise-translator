# Mantiene al día las actions fijadas por SHA y las dependencias de npm.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: deps
    groups:
      # Un solo PR por mes para todo lo de desarrollo.
      dev-dependencies:
        dependency-type: development
