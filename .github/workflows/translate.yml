# Traduce cada hora los documentos de Reader con el tag "translate".
# Secrets requeridos en el repo: READWISE_TOKEN, LLM_API_KEY (o ANTHROPIC_API_KEY).
name: translate-reader

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  group: translate-reader
  cancel-in-progress: false

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run translate -- --tag
        env:
          READWISE_TOKEN: ${{ secrets.READWISE_TOKEN }}
          PROVIDER: openai-compatible
          LLM_BASE_URL: https://generativelanguage.googleapis.com/v1beta/openai
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: gemini-flash-latest
          REQUESTS_PER_MINUTE: "8"
          TARGET_LANG: es
