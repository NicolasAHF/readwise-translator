# Traduce cada hora los documentos de Reader con el tag "translate".
# Secrets requeridos en el repo: READWISE_TOKEN, LLM_API_KEY (o ANTHROPIC_API_KEY).
#
# El repo es público y los logs de Actions también: por eso corre con --quiet,
# que imprime solo ids y conteos (nunca títulos ni URLs de lo que leés).
# Los secrets nunca se imprimen: GitHub los enmascara con *** aunque aparecieran.
name: translate-reader

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  group: translate-reader
  cancel-in-progress: false

# Mínimo privilegio: el job solo lee el código; todo lo demás va por las APIs con secrets propios.
permissions:
  contents: read

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Actions fijadas por SHA de commit (un tag se puede mover; un SHA no).
      # Dependabot (.github/dependabot.yml) abre PRs cuando salen versiones nuevas.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # no hacemos push: el token de git no queda en disco
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          # Sin cache: npm ci tarda ~3s y así ningún cache compartido toca un job con secrets.
          package-manager-cache: false
      - run: npm ci
      - run: npm run translate -- --tag --quiet
        env:
          READWISE_TOKEN: ${{ secrets.READWISE_TOKEN }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          # Todo lo de abajo se configura sin tocar código desde
          # Settings → Secrets and variables → Actions → Variables.
          # Si la variable no existe, se usa el default de la derecha (Gemini).
          PROVIDER: ${{ vars.PROVIDER || 'openai-compatible' }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL || 'https://generativelanguage.googleapis.com/v1beta/openai' }}
          LLM_MODEL: ${{ vars.LLM_MODEL || 'gemini-flash-latest' }}
          # Modelos que razonan (Gemini 3, gpt-oss): "low" lo minimiza y suma margen de tokens.
          LLM_REASONING_EFFORT: ${{ vars.LLM_REASONING_EFFORT || 'low' }}
          # Tokens extra de salida para el razonamiento (Groq free: bajalo a ~1024 por su límite de 8K TPM).
          LLM_REASONING_HEADROOM: ${{ vars.LLM_REASONING_HEADROOM || '8192' }}
          # Free tier: de a un chunk, con margen bajo el límite de RPM (menos 429/503).
          CONCURRENCY: ${{ vars.CONCURRENCY || '1' }}
          REQUESTS_PER_MINUTE: ${{ vars.REQUESTS_PER_MINUTE || '5' }}
          # Proveedores con límite de tokens por minuto bajo (ej. Groq: 8K TPM) necesitan chunks chicos.
          CHUNK_CHARS: ${{ vars.CHUNK_CHARS || '12000' }}
          TARGET_LANG: es
          # Borra el original y deja un link a la fuente en la traducción.
          # Si el original tiene highlights o nota (o algo no cierra), lo archiva en vez de borrarlo.
          ORIGINAL_ACTION: delete
