# Traduce cada hora los documentos de Reader con el tag "translate".
# Secrets requeridos en el repo: READWISE_TOKEN, LLM_API_KEY (o ANTHROPIC_API_KEY).
#
# El repo es público y los logs de Actions también: por eso corre con --quiet,
# que imprime solo ids y conteos (nunca títulos ni URLs de lo que leés).
# Los secrets nunca se imprimen: GitHub los enmascara con *** aunque aparecieran.
name: translate-reader

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  group: translate-reader
  cancel-in-progress: false

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run translate -- --tag --quiet
        env:
          READWISE_TOKEN: ${{ secrets.READWISE_TOKEN }}
          PROVIDER: openai-compatible
          LLM_BASE_URL: https://generativelanguage.googleapis.com/v1beta/openai
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: gemini-flash-latest
          # Gemini 3 siempre razona; "low" lo minimiza y suma margen de tokens para que no se corte.
          LLM_REASONING_EFFORT: low
          # Free tier: de a un chunk, con margen bajo el límite de RPM (menos 429/503).
          CONCURRENCY: "1"
          REQUESTS_PER_MINUTE: "5"
          TARGET_LANG: es
          # Borra el original y deja un link a la fuente en la traducción.
          # Si el original tiene highlights o nota (o algo no cierra), lo archiva en vez de borrarlo.
          ORIGINAL_ACTION: delete
