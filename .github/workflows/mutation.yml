# Mutation testing con Stryker: mide qué tan buenos son los tests, no solo cuánto cubren.
# Corre el primer día de cada mes o a mano (Actions → mutation-testing → Run workflow).
# No usa secrets: todo corre contra fakes, sin red.
name: mutation-testing

on:
  schedule:
    - cron: "43 9 1 * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutation-testing
  cancel-in-progress: true

jobs:
  stryker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      # Falla si el score cae por debajo de thresholds.break (stryker.config.mjs).
      - run: npm run test:mutation
      - name: Resumen en la página del run
        if: ${{ !cancelled() }}
        run: node scripts/mutation-summary.mjs
      - name: Reporte HTML
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-report
          path: reports/mutation/
          retention-days: 30
          if-no-files-found: warn
